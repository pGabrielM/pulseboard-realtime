name: Cron Check

# Free scheduler for the hosted demo: pings the cron endpoint every 5 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Ping cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: curl -fsS --retry 2 --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/check"
