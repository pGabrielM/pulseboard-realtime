services:
  postgres:
    image: postgres:18-alpine
    container_name: pulseboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
      POSTGRES_DB: pulseboard
    ports:
      - '${POSTGRES_PORT:-5453}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulseboard -d pulseboard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
